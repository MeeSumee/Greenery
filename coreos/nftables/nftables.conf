#!/usr/sbin/nft -f
# Replicates the relevant restrictions from modules/networking/openssh.nix
# (SSH only on tailscale0) and modules/hardware/ups.nix (NUT port 3493 only
# on tailscale0). Random MAC spoofing and some other NetworkManager-level
# hardening from modules/networking/default.nix has no nftables equivalent
# and isn't reproduced here -- see plan §7.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # SSH and NUT: tailnet only, matching the current
        # networking.firewall.interfaces."tailscale0".allowedTCPPorts posture.
        iifname "tailscale0" tcp dport 22 accept
        iifname "tailscale0" tcp dport 3493 accept

        # Tailscale's own UDP port must stay open on all interfaces for the
        # tunnel itself to establish/maintain (not an app port).
        udp dport 41641 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
