# Arch-native equivalent of modules/programs/foot.nix
#
# home-manager/NixOS's `programs.foot.theme = "rose-pine"` pulls a
# pre-made colors block from nixpkgs' copy of codeberg.org/dnkl/foot-themes
# and merges it under this file's own `settings`. foot itself has no
# `theme=` key -- that's a Nix-side convenience -- so here the [colors]
# section below is written out directly instead. Values are the official
# Rosé Pine 16-color ANSI palette (verified against
# raw.githubusercontent.com/rose-pine/kitty/main/dist/rose-pine.conf,
# same palette used by every other official rose-pine terminal port).

[main]
gamma-correct-blending=no
dpi-aware=yes
font=CaskaydiaMono Nerd Font:size=10
font-bold=CaskaydiaMono Nerd Font:weight=bold:size=10
font-bold-italic=CaskaydiaMono Nerd Font:weight=bold:slant=italic:size=10
font-italic=CaskaydiaMono Nerd Font:slant=italic:size=10
pad=5x5 center

[security]
osc52=enabled

[scrollback]
lines=2000
multiplier=2.0
indicator-format=line

[cursor]
unfocused-style=hollow
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
search-start=Control+Shift+f

[colors-dark]
alpha=0.8
blur=yes
background=191724
foreground=e0def4
regular0=26233a
regular1=eb6f92
regular2=31748f
regular3=f6c177
regular4=9ccfd8
regular5=c4a7e7
regular6=ebbcba
regular7=e0def4
bright0=6e6a86
bright1=eb6f92
bright2=31748f
bright3=f6c177
bright4=9ccfd8
bright5=c4a7e7
bright6=ebbcba
bright7=e0def4
selection-foreground=e0def4
selection-background=403d52
