[bar.default]
background_opacity = 0.79999998211860657
center = [ "workspaces" ]
end = [
    "media",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "clock" ]
widget_spacing = 20

[desktop_widgets]
enabled = false

[location]
address = "Chicago"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 890.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 3500

[shell]
app_icon_colorize = true
avatar_path = "/home/sumee/.face.icon"
clipboard_enabled = false
clipboard_keep_from_closed_apps = false
font_family = "CaskaydiaCove Nerd Font"
password_style = "random"

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Rosé Pine"
source = "wallpaper"

    [theme.templates]
    enable_community_templates = false

[wallpaper]
directory = "/home/sumee/wallpapers"

    [wallpaper.default]
    path = "/home/sumee/wallpapers/schizomiku.jpg"

    [wallpaper.last]
    path = "/home/sumee/wallpapers/schizomiku.jpg"

[widget.clock]
font_weight = 700

[widget.control-center]
glyph = "settings"
